# FineTune Studio - one-command local stack.
#
#   docker compose up --build
#
# Backend listens on http://localhost:8000 (Swagger at /docs).
# Frontend listens on http://localhost:3000.
#
# All persistent state lives in named volumes; if you want to inspect it on
# the host instead, change `data:` etc. to bind mounts (see commented lines).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finetune-studio-backend:latest
    container_name: finetune-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override paths so they match the named volumes mounted below.
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      MODELS_DIR: /app/models
      # The frontend container reaches the backend at http://backend:8000;
      # CORS only matters for the browser, which still talks to localhost:3000.
      CORS_ORIGINS_RAW: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_models:/app/models
      # - ./backend/data:/app/data       # bind mount alternative
      # - ./backend/uploads:/app/uploads
      # - ./backend/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: finetune-studio-frontend:latest
    container_name: finetune-frontend
    restart: unless-stopped
    environment:
      # Server-only, used by next.config.mjs at startup.
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
  backend_models:
